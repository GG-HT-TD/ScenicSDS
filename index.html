const fams = [...new Set(P.map(p=>p.f))].sort();
let fam = "";
const chips = document.getElementById("chips");
function drawChips(){
  chips.innerHTML = "";
  const all = document.createElement("button");
  all.className = "chip"+(fam===""?" on":""); all.textContent = "All";
  all.onclick = ()=>{fam="";drawChips();render();};
  chips.appendChild(all);
  fams.forEach(f=>{
    const b = document.createElement("button");
    b.className = "chip"+(fam===f?" on":""); b.textContent = f;
    b.onclick = ()=>{fam=(fam===f?"":f);drawChips();render();};
    chips.appendChild(b);
  });
}
const list = document.getElementById("list"), q = document.getElementById("q"),
      count = document.getElementById("count"), empty = document.getElementById("empty");
document.getElementById("cov").textContent = P.length + " safety data sheets on file.";
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function render(){
  const t = q.value.trim().toLowerCase();
  const hits = P.filter(p=>{
    if(fam && p.f!==fam) return false;
    if(!t) return true;
    return (p.n+" "+p.m).toLowerCase().includes(t);
  }).slice(0,120);
  count.textContent = hits.length + (hits.length>=120?" (first 120)":"") + " of " + P.length + " sheets";
  empty.hidden = hits.length>0;
  list.innerHTML = hits.map(p=>{
    const bc = p.b==="EXACT"?"b-exact":(p.b==="COMPARABLE"?"b-comp":"b-legacy");
    return `<div class="card"><div class="info"><h2>${esc(p.n)}</h2>`+
      `<div class="meta"><span class="badge ${bc}">${p.b}</span>${esc(p.m)} &middot; Rev ${esc(p.r)}</div></div>`+
      `<a class="open" href="${esc(p.u)}">Open SDS</a></div>`;
  }).join("");
}
q.addEventListener("input", render);
drawChips(); render();
